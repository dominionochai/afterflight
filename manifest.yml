modules:
  jira:adminPage:
    - key: afterflight-admin
      title: Afterflight
      resource: main
      resolver:
        function: resolver-fn
      render: native
  function:
    - key: resolver-fn
      handler: index.handler
resources:
  - key: main
    path: src/frontend/index.jsx
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - manage:jira-configuration
app:
  runtime:
    name: nodejs22.x
